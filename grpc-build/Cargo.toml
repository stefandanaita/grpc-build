[package]
name = "grpc-build"
version = "8.0.0"
authors = ["Stefan Adrian Danaita <me@dsa.io>"]
license = "MIT"
edition = "2024"

readme = "../README.md"
description = "gPRC compilation made easy"
homepage = "https://github.com/stefandanaita/grpc-build"
repository = "https://github.com/stefandanaita/grpc-build"

keywords = ["grpc", "tonic", "proto"]
categories = ["development-tools"]

[[bin]]
path = "src/main.rs"
name = "grpc_build"

[lib]
path = "src/lib.rs"
name = "grpc_build"

[dependencies]
prost = "0.13"
anyhow = "1"
tonic-build = "0.13"
prost-build = "0.13"
clap = { version ="4.5.36", features = ["derive"] }
paw = "1"
walkdir = "2.5"
tempfile = "3.19"
prost-types = "0.13"
fs-err = "3.1"

[dev-dependencies]
tonic = "0.13"
trybuild = "1.0"
grpc-build-core = { path = "../grpc-build-core" }
